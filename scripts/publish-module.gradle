// Publishes the library to Maven Central through the Sonatype Central Portal.
//
// Coordinates come from gradle.properties (GROUP / POM_ARTIFACT_ID / VERSION_NAME).
// Credentials and the signing key are supplied as Gradle properties, which CI passes
// as environment variables:
//   ORG_GRADLE_PROJECT_mavenCentralUsername       Central Portal user token name
//   ORG_GRADLE_PROJECT_mavenCentralPassword       Central Portal user token password
//   ORG_GRADLE_PROJECT_signingInMemoryKey         ASCII-armored PGP private key
//   ORG_GRADLE_PROJECT_signingInMemoryKeyId       (optional) last 8 hex chars of the key id
//   ORG_GRADLE_PROJECT_signingInMemoryKeyPassword (optional) key passphrase
//
// Whether a deployment is released automatically or left pending for a manual
// "Publish" click in the Central Portal is controlled by the
// mavenCentralAutomaticPublishing property in gradle.properties, which CI can
// override with -PmavenCentralAutomaticPublishing=true|false.
mavenPublishing {
  publishToMavenCentral()
  signAllPublications()

  coordinates(GROUP, POM_ARTIFACT_ID, VERSION_NAME)

  // Android library defaults: publishes the "release" variant with sources and javadoc jars.

  pom {
    name = POM_ARTIFACT_ID
    description = "A small Android library to get the market name of an Android device."
    url = "https://github.com/ravibpatel/AndroidDeviceNames"
    licenses {
      license {
        name = "The Apache License, Version 2.0"
        url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
      }
    }
    developers {
      developer {
        id = "jaredrummler"
        name = "Jared Rummler"
        email = "jaredrummler@gmail.com"
      }
      developer {
        id = "ravibpatel"
        name = "Ravi Patel"
        url = "https://github.com/ravibpatel"
      }
    }
    scm {
      url = "https://github.com/ravibpatel/AndroidDeviceNames"
      connection = "scm:git:git://github.com/ravibpatel/AndroidDeviceNames.git"
      developerConnection = "scm:git:ssh://git@github.com/ravibpatel/AndroidDeviceNames.git"
    }
  }
}
