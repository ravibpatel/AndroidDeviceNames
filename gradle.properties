# Project-wide Gradle settings.

org.gradle.jvmargs=-Xmx2048m

android.useAndroidX=true

# Maven coordinates of the published library. VERSION_NAME is bumped automatically
# by .github/workflows/update-database.yml whenever a new device database is committed.
GROUP=org.rbsoft
POM_ARTIFACT_ID=android-device-names
VERSION_NAME=2.2.0

# true: the monthly job releases to Maven Central without supervision.
# Set it false to have uploads validated and then wait in the Central Portal for a
# manual "Publish" click. Releases to Maven Central cannot be undone.
mavenCentralAutomaticPublishing=true
